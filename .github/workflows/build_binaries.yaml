name: Build QMK firmware

on: [push, workflow_dispatch]

permissions:
  contents: write

jobs:
  build:
    name: 'QMK Userspace Build'
    uses: qmk/.github/.github/workflows/qmk_userspace_build.yml@main
    with:
      qmk_repo: bastardkb/bastardkb-qmk
      qmk_ref: bkb-procyon
      # Wrap the parent dilemma config.h's POINTING_DEVICE_TASK_THROTTLE_MS=10
      # define in an #ifndef guard so keymap-level overrides win. Empirical probe
      # showed keymap config.h runs BEFORE the parent config.h in QMK's preprocessor
      # chain, so without a guard the parent silently re-#defines after our override.
      preparation_command: |
        sed -i 's|^    #define POINTING_DEVICE_TASK_THROTTLE_MS 10|    #ifndef POINTING_DEVICE_TASK_THROTTLE_MS\n    #define POINTING_DEVICE_TASK_THROTTLE_MS 10\n    #endif|' qmk_firmware/keyboards/bastardkb/dilemma/config.h
        echo "--- patched dilemma config.h ---"
        grep -B1 -A3 'POINTING_DEVICE_TASK_THROTTLE_MS' qmk_firmware/keyboards/bastardkb/dilemma/config.h
        echo "--- inject probes into cirque_pinnacle.c (compiled for keymap target) ---"
        cat > /tmp/probe.h <<'PROBE'
        #if defined(POINTING_DEVICE_GESTURES_CURSOR_GLIDE_ENABLE)
        #error "VANE-CIRQUE-C: CURSOR_GLIDE IS defined when cirque_pinnacle.c compiles"
        #else
        #error "VANE-CIRQUE-C: CURSOR_GLIDE NOT defined when cirque_pinnacle.c compiles"
        #endif
        PROBE
        # Inject the probe at top of cirque_pinnacle.c — it'll abort compile with our message
        cat /tmp/probe.h qmk_firmware/drivers/sensors/cirque_pinnacle.c > /tmp/patched.c
        mv /tmp/patched.c qmk_firmware/drivers/sensors/cirque_pinnacle.c
        head -10 qmk_firmware/drivers/sensors/cirque_pinnacle.c

  publish:
    name: 'QMK Userspace Publish'
    uses: bastardkb/qmk_userspace/.github/workflows/qmk_userspace_publish_develop.yml@develop
    if: always() && !cancelled()
    needs: build
